<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Trackdown</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="description" content="Name the track before your friends do." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trackdown" />
    <meta property="og:title" content="Trackdown" />

    <meta property="og:url" content="https://trackdown.tikugato.dev/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1d1510" />
    <script>
      const stored = localStorage.getItem('trackdown.theme')
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.dataset.theme = stored
      }
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
